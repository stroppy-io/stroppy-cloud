components:
  schemas:
    RunStatus:
      type: string
      enum: [pending, running, cancelling, completed, failed, cancelled]
    RunPhase:
      type: string
      enum: [queued, provisioning, deploying, workload, collecting, teardown, done]
    Trigger:
      type: string
      enum: [manual, suite, api, schedule]
    RunRef:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { $ref: '#/components/schemas/RunStatus' }
        started_at: { type: [string, 'null'], format: date-time }
    RunSummary:
      type: object
      description: Denormalized fields for lists, sorting and rating.
      properties:
        db_kind: { $ref: '#/components/schemas/DatabaseKind' }
        db_version: { type: string }
        workload_name: { type: string }
        protocol: { $ref: '#/components/schemas/Protocol' }
        stroppy_version: { type: string }
        topology: { $ref: '#/components/schemas/TopologyShape' }
        node_count: { type: integer }
        provider_kind: { $ref: '#/components/schemas/ProviderKind' }
        provider_profile: { $ref: '#/components/schemas/Ref' }
        sizes: { $ref: '#/components/schemas/RoleSizes' }
        progress_pct: { type: number, minimum: 0, maximum: 100 }
        phase_progress_pct: { type: number, minimum: 0, maximum: 100, description: 'How far the current phase is (read-time): the workload by elapsed planned time, other phases by finished steps.' }
        segment: { type: string, description: Current workload segment while running. }
        workload_from:
          type: string
          format: date-time
          description: >-
            Where the workload's planned time starts (read-time): the workload
            phase's start shifted past the running segment's data preparation.
            With `expected_finish_at` it gives the workload's progress at any
            instant: (now − workload_from) / (expected_finish_at − workload_from).
        stage:
          type: object
          description: >-
            Where the running segment's stroppy is (read-time, from its log): the
            step it prepares, or under load the last step it finished, and since
            when. While preparing, `expected_finish_at` is absent; under load the
            plan counts from the load's start.
          required: [kind, step, since]
          properties:
            kind: { $ref: '#/components/schemas/RunStageKind' }
            step: { type: string, description: 'stroppy step id, e.g. `load_data`, `validate_population`.' }
            since: { type: string, format: date-time }
        headline:
          type: object
          description: >-
            Key result metrics once available: `tps`, `latency_p50_ms`,
            `latency_p95_ms`, `latency_p99_ms`, `qps` (queries per second of
            the whole workload — the segments' `queries_per_second` weighted
            by their `measurement_seconds`, else their plain mean), `errors`
            (terminal errors over all segments; absent = none), and every
            segment metric as `<segment>.<metric>`.
          additionalProperties: { type: number }
          example: { tps: 12345.6, qps: 48210.3, latency_p50_ms: 3.1, latency_p99_ms: 12.4, errors: 0 }
        qps_series:
          type: array
          description: >-
            Queries per second over the workload (its segments, else the
            workload phase), about 30 points in time order, summed across
            runners — for an inline sparkline. Stored when the run finishes;
            absent while running or not yet sampled, empty when the metric
            store had no throughput for the run.
          items:
            type: object
            required: [t, v]
            properties:
              t: { type: integer, format: int64, description: Sample time, unix milliseconds. }
              v: { type: number, description: Queries per second. }
        expected_finish_at:
          type: [string, 'null']
          format: date-time
          description: >-
            When the workload is planned to end — the workload phase start
            plus every segment's warmup + duration, re-anchored on the
            segments already started or finished. Workload time only
            (collecting and teardown are not predicted). Absent before the
            workload starts, for finished runs and for workloads with a
            segment of unbounded length.
    Run:
      type: object
      required: [id, name, status, phase, trigger, test_ref, snapshot, author, created_at, rating, stand_kept]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { $ref: '#/components/schemas/RunStatus' }
        phase: { $ref: '#/components/schemas/RunPhase' }
        status_reason: { type: string, description: Failure/cancel reason. }
        stand_kept: { type: boolean }
        keep_until: { type: [string, 'null'], format: date-time }
        trigger: { $ref: '#/components/schemas/Trigger' }
        trigger_ref:
          type: object
          properties:
            schedule_id: { type: string, format: uuid }
            suite_run_id: { type: string, format: uuid }
            cell_id: { type: string }
            parent_run_id: { type: string, format: uuid, description: Set for rerun/resume/clone lineage. }
        test_ref:
          allOf: [{ $ref: '#/components/schemas/Ref' }]
          description: Source test (may be deleted later; snapshot remains).
        snapshot: { $ref: '#/components/schemas/RunSnapshot' }
        run_spec:
          allOf: [{ $ref: '#/components/schemas/BakedValue' }]
          x-schema: spec.run
          readOnly: true
          description: The exact RunSpec handed to the pipeline (secrets are names only).
        rating: { $ref: '#/components/schemas/RatingFlags' }
        notes: { type: string, description: Markdown. }
        labels: { type: object, additionalProperties: { type: string } }
        author: { $ref: '#/components/schemas/UserRef' }
        is_favorite: { type: boolean }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        duration: { type: [string, 'null'], description: Go duration; ticks client-side while running. }
        summary: { $ref: '#/components/schemas/RunSummary' }
        result: { $ref: '#/components/schemas/RunResult' }
        graphene:
          type: object
          readOnly: true
          properties:
            run_ref: { type: string, example: 'run/8f1c…' }
            namespace: { type: string }
            pipeline_revision: { type: string }
        shares:
          type: array
          readOnly: true
          items: { $ref: '#/components/schemas/Ref' }
        queue: { $ref: '#/components/schemas/RunQueue' }
    RunQueue:
      type: object
      readOnly: true
      description: >-
        Set while the run waits in the tenant's queue (status pending, never handed to
        Graphene): its place and what holds it. A run that fits starts before the ones
        ahead of it that do not.
      required: [waiting_for, position]
      properties:
        waiting_for: { $ref: '#/components/schemas/RunWaitReason' }
        position: { type: integer, minimum: 1, description: 1-based among the tenant's queued runs. }
        live: { type: integer, description: 'Cells of the suite running (suite_slot).' }
        limit: { type: integer, description: 'Concurrency of the suite (suite_slot).' }
        quota: { type: string, description: 'Provider quota without room (quota).', example: compute.ssdDisks.size }
        zone: { type: string, description: Zone of a zonal quota. }
        need: { type: number, description: What the run needs of the quota, in unit. }
        free: { type: number, description: What is free of the quota, in unit. }
        unit: { type: string }
        detail: { type: string, description: 'State behind pipelines, provider and quota_unknown; the address pool behind subnets.' }
    RunWaitReason:
      type: string
      enum: [pipelines, suite_slot, quota, quota_unknown, provider, suspended, subnets]
      description: >-
        pipelines — the tenant's pipelines are not pushed at this server's revision yet;
        suite_slot — the suite runs as many cells as its
        concurrency; quota — a provider quota has no room; quota_unknown — the quotas could
        not be read; provider — the provider profile is not ready; suspended — a platform
        admin suspended the tenant; subnets — the provider profile's address pool has no
        free block for the run's subnets (detail is the pool).
    RunSnapshot:
      type: object
      description: Definition frozen at launch.
      required: [database, workload, sizes, provider_profile]
      properties:
        execution:
          allOf: [{ $ref: '#/components/schemas/SchemaValue' }]
          x-schema: test.runtime@1
          description: Frozen final deployment overrides used for replay.
        database: { $ref: '#/components/schemas/DatabaseSpec' }
        database_name: { type: string }
        workload: { $ref: '#/components/schemas/WorkloadSpec' }
        workload_name: { type: string }
        sizes: { $ref: '#/components/schemas/RoleSizes' }
        provider_profile: { $ref: '#/components/schemas/Ref' }
        keep: { type: string }
        effective_configs:
          type: object
          description: Per role → config schema id → Baked value that was rendered.
          additionalProperties:
            type: object
            additionalProperties: { $ref: '#/components/schemas/BakedValue' }
        machines:
          type: array
          items: { $ref: '#/components/schemas/RunMachine' }
        tuning: { $ref: '#/components/schemas/RunTuning' }
    RunMachine:
      type: object
      required: [name, role, size]
      properties:
        name: { type: string }
        role: { $ref: '#/components/schemas/TopologyRole' }
        size: { $ref: '#/components/schemas/Size' }
        cpu: { type: integer }
        memory_gb: { type: integer }
        disk_gb: { type: integer }
        disk_type: { type: string }
        instance_type: { type: string }
        location: { type: string }
        cache_mb: { type: integer, description: "The database engine's own cache on this machine, MB (buffer pool, shared buffers, block cache, memtx arena)." }
        disk_read_iops: { type: integer, description: Provider read IOPS limit of the data disk. }
        disk_write_iops: { type: integer, description: Provider write IOPS limit of the data disk. }
        disk_read_mbps: { type: integer, description: Provider read bandwidth limit of the data disk, MB/s. }
        disk_write_mbps: { type: integer, description: Provider write bandwidth limit of the data disk, MB/s. }
    RunTuning:
      type: object
      description: How the database and the load client were set up; absent for runs from before it.
      properties:
        mode: { $ref: '#/components/schemas/TuningMode' }
        durability: { $ref: '#/components/schemas/CommitDurability' }
        auto:
          type: object
          description: Every value auto tuning set — role → config schema id → key → value. Empty under stock tuning and for runs from before it.
          additionalProperties:
            type: object
            additionalProperties:
              type: object
              additionalProperties: {}
        client:
          type: object
          description: The stroppy driver the workload ran with.
          properties:
            driver_type: { type: string }
            settings:
              type: object
              description: Driver options of stroppy's config (pool, bulkSize…), the connection URL left out.
              additionalProperties: {}
            auto:
              type: array
              description: Settings auto tuning chose, as dotted paths (pool.maxConns).
              items: { type: string }
    RunResult:
      type: object
      description: Typed result from the pipeline (`RunResult`).
      properties:
        metrics:
          type: object
          additionalProperties: { $ref: '#/components/schemas/MetricValue' }
        segments:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name: { type: string }
              status: { type: string, enum: [completed, failed, skipped, cancelled] }
              started_at: { type: string, format: date-time }
              finished_at: { type: string, format: date-time }
              exit_code: { type: integer, description: Native Stroppy process exit code, including zero. }
              error: { type: string, description: Segment failure diagnostic. }
              errors: { $ref: '#/components/schemas/RunSegmentErrors' }
              compliance: { description: Native workload compliance report, preserved without interpreting its fields. }
              report: { description: Native versioned Stroppy run JSON, including unknown fields and workload payloads. Use lossless JSON decoding for large integers. }
              report_artifact: { type: string, description: 'Published original JSON report: artifact/<id>; retained 30 days.' }
              report_omitted: { type: string, description: Reason the complete report is available only as an artifact (inline size limit). }
              metrics:
                type: object
                additionalProperties: { $ref: '#/components/schemas/MetricValue' }
              error_log:
                type: array
                description: What Stroppy logged as errors and warnings, grouped by level, message, error and class; the most frequent first, at most 20.
                items: { $ref: '#/components/schemas/RunErrorLogEntry' }
        artifacts:
          type: array
          items: { type: string, description: 'artifact/<id>' }
        baseline: { $ref: '#/components/schemas/RunBaselineResult' }
        summary: { $ref: '#/components/schemas/PipelineSummary' }
    RunErrorLogEntry:
      type: object
      required: [level, count]
      properties:
        level: { type: string, description: 'Log level: error, warn, dpanic, panic or fatal.' }
        message: { type: string }
        error: { type: string }
        class: { type: string, description: Stroppy's error class (serialization, deadlock, unknown…). }
        count: { type: integer, format: int64 }
        first_at: { type: string, format: date-time }
        last_at: { type: string, format: date-time }
        sql: { type: string, description: One statement that failed this way. }
    RunSegmentErrors:
      type: object
      required: [terminal_errors, failed_iterations, failed_queries, retry_attempts]
      properties:
        terminal_errors: { type: integer, format: int64 }
        failed_iterations: { type: integer, format: int64 }
        failed_queries: { type: integer, format: int64 }
        retry_attempts: { type: integer, format: int64 }
    RunBaselineResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        verdicts:
          type: array
          items:
            type: object
            required: [check, status]
            properties:
              check: { type: string }
              status: { type: string }
              detail: { type: string }
        report: { description: Complete native machine baseline report. }
        error: { type: string }
    PipelineSummary:
      type: object
      description: Native pipeline headline; absent throughput is not zero throughput. Other workload metrics remain in metrics.
      properties:
        tps: { type: number }
        latency_p50_ms: { type: number }
        latency_p95_ms: { type: number }
        latency_p99_ms: { type: number }
        errors: { type: integer, format: int64 }
        duration: { type: string }
    MetricValue:
      type: object
      required: [value]
      properties:
        value: { type: number }
        unit: { type: string }
        min: { type: number }
        max: { type: number }
        avg: { type: number }
    RunPatch:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        notes: { type: string, maxLength: 65536 }
        labels: { type: object, additionalProperties: { type: string } }
        rating: { $ref: '#/components/schemas/RatingFlags' }
    RunOverview:
      type: object
      required: [run_id, status, phase, source, observed_at, phases, components, machines]
      properties:
        run_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/RunStatus' }
        phase: { $ref: '#/components/schemas/RunPhase' }
        progress_pct: { type: number }
        source:
          type: string
          enum: [live, persisted, synthetic]
          description: live = Graphene projection is fresh; persisted = last stored state; synthetic = before the run exists.
        observed_at: { type: string, format: date-time }
        degraded_reasons:
          type: array
          items: { type: string }
        phases:
          type: array
          items:
            type: object
            required: [id, title, status]
            properties:
              id: { $ref: '#/components/schemas/RunPhase' }
              title: { type: string }
              status: { type: string, enum: [pending, running, completed, failed, skipped, cancelled] }
              started_at: { type: [string, 'null'], format: date-time }
              finished_at: { type: [string, 'null'], format: date-time }
              steps:
                type: array
                items:
                  type: object
                  required: [id, title, status]
                  properties:
                    id: { type: string, description: Stable node id; usable as a log filter (`phase`/`segment`). }
                    title: { type: string }
                    status: { type: string }
                    role: { type: string }
                    machine: { type: string }
                    attempt: { type: integer }
                    error: { type: string }
                    started_at: { type: [string, 'null'], format: date-time }
                    finished_at: { type: [string, 'null'], format: date-time }
        components:
          type: array
          description: Deployed software (containers) by role.
          items:
            type: object
            required: [id, role, machine, status]
            properties:
              id: { type: string }
              role: { $ref: '#/components/schemas/TopologyRole' }
              engine: { type: string }
              image: { type: string }
              machine: { type: string }
              status: { type: string, enum: [pending, creating, ready, failed, deleting, deleted] }
              endpoints:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    address: { type: string }
                    port: { type: integer }
              scrape: { type: string }
        machines:
          type: array
          items:
            type: object
            required: [name, role, status, presence]
            properties:
              name: { type: string }
              role: { $ref: '#/components/schemas/TopologyRole' }
              status: { type: string, enum: [pending, creating, ready, failed, deleting, deleted] }
              presence: { type: string, enum: [online, stale, offline, terminated] }
              agent_id: { type: string }
              address: { type: string }
              public_ip: { type: string }
              size: { $ref: '#/components/schemas/Size' }
              provider_resource_id: { type: string }
              last_heartbeat_at: { type: [string, 'null'], format: date-time }
        flows:
          type: array
          items:
            type: object
            properties:
              from: { type: string }
              to: { type: string }
              protocol: { type: string }
              port: { type: integer }
        workload_segments:
          type: array
          description: Segment windows for the metrics/Grafana window selector.
          items:
            type: object
            required: [name, status]
            properties:
              name: { type: string }
              status: { type: string }
              started_at: { type: [string, 'null'], format: date-time }
              finished_at: { type: [string, 'null'], format: date-time }
        connectivity: { $ref: '#/components/schemas/RunConnectivity' }
        pending_activity:
          type: object
          description: What the run is waiting on right now (from Graphene RunStatus).
          properties:
            activity: { type: string }
            attempt: { type: integer }
            since: { type: string, format: date-time }
            last_failure: { type: string }
    RunConnectivity:
      type: object
      description: >-
        The connectivity check after deploy: every machine dialed every other
        machine's published ports, the runner the workload's endpoint. A failed
        critical path (a database, proxy or coordinator port, or the endpoint)
        failed the run before the workload; other failed paths only warn. The
        machines on both ends of a failed path left a network snapshot. Absent
        when the run has not been checked (single machine, before deploy).
      required: [total, failed, critical, pairs, snapshots]
      properties:
        checked_at: { type: string, format: date-time }
        total: { type: integer, description: Paths dialed. }
        failed: { type: integer, description: Paths not ok. }
        critical: { type: integer, description: Failed paths the cluster or the workload needs. }
        pairs:
          type: array
          description: Failed paths first.
          items: { $ref: '#/components/schemas/ConnectivityPair' }
        snapshots:
          type: array
          items:
            type: object
            required: [machine, artifact_id]
            properties:
              machine: { type: string }
              artifact_id: { type: string, description: 'Text artifact (downloadRunArtifact): addresses, routes, neighbors, listeners, half-open connects, firewall rules, sysctl, dmesg tail.' }
    ConnectivityPair:
      type: object
      required: [from, to, port, critical, outcome]
      properties:
        from: { type: string, description: Machine that dialed. }
        to: { type: string, description: Machine dialed (or the endpoint's host). }
        port: { type: integer }
        address: { type: string }
        container: { type: string, description: Container that publishes the port. }
        critical: { type: boolean }
        outcome: { $ref: '#/components/schemas/ConnectivityOutcome' }
        latency_ms: { type: number }
        attempts: { type: integer }
        error: { type: string }
    ResourceTree:
      type: object
      description: >-
        A record of the run with what it owns and what it talks to — the run's
        topology, drawn from one call: nodes are the records (machines,
        containers, agents, artifacts), edges are their declared flows.
        A finished run keeps its records here, with phase `deleted`.
      required: [ref, kind]
      properties:
        ref: { type: string }
        kind: { type: string }
        phase: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
          description: >-
            Record markers. A container of a run carries `container`, `role`,
            `machine` and `kind` (database, proxy, coordinator, exporter,
            addon); an agent carries `role` and `machine`.
        flows:
          type: array
          description: Declared outgoing edges of this record (intent, not observed traffic).
          items:
            type: object
            required: [to]
            properties:
              to: { type: string, description: 'Target record ref ("docker/<run>-db-1-postgres") or an external endpoint.' }
              protocol: { type: string, description: 'tcp, http, grpc, otlp, prometheus_pull, … — an open vocabulary.' }
              port: { type: integer }
              label: { type: string }
              virtual: { type: boolean, description: A system edge that always exists (agent↔server), not one the run declared. }
        keep_until: { type: [string, 'null'], format: date-time }
        children:
          type: array
          items: { $ref: '#/components/schemas/ResourceTree' }
    RunEvent:
      type: object
      required: [id, at, kind, title]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        kind: { $ref: '#/components/schemas/RunEventKind' }
        title: { type: string }
        subject: { type: string, description: Graphene ref or role/machine. }
        status: { type: string }
        error: { type: string }
        attempt: { type: integer }
        payload: { type: object, additionalProperties: true }
        log_ref:
          type: object
          description: Deep link into the logs.
          properties:
            filter: { type: object, additionalProperties: true }
            cursor: { type: string }
    LogLine:
      type: object
      required: [time, message]
      properties:
        time: { type: string, format: date-time }
        seq: { type: integer }
        message: { type: string }
        level: { $ref: '#/components/schemas/LogLevel' }
        stream: { type: string }
        role: { type: string }
        machine: { type: string }
        container: { type: string }
        phase: { type: string }
        segment: { type: string }
        fields: { type: object, additionalProperties: { type: string } }
    LogPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/LogLine' }
        older: { type: [string, 'null'], description: Cursor towards the past. }
        newer: { type: [string, 'null'], description: Cursor towards the present. }
        truncated: { type: boolean }
    MetricOrigin:
      type: string
      enum: [exporter, workload, container, pipeline]
      description: >-
        Where a metric comes from: exporter — a container's own Prometheus endpoint (node_exporter,
        the database's exporter, a proxy, the engine itself); workload — stroppy; container — the
        container statistics the agent samples; pipeline — the pipeline's own telemetry.
    MetricKind:
      type: string
      enum: [counter, gauge]
      description: counter — grows over the run (its rate is what to look at); gauge — a level.
    MetricSeriesFn:
      type: string
      enum: [value, rate]
      description: value — the stored samples; rate — the per-second increase (counters).
    MetricSeriesAgg:
      type: string
      enum: [sum, avg, max, min]
    RunMetricNames:
      type: object
      required: [window, data]
      properties:
        window:
          type: object
          required: [start, end]
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
            segment: { type: string }
        data:
          type: array
          items:
            type: object
            required: [name, origin, kind, series, machines, roles, containers]
            properties:
              name: { type: string, example: node_cpu_seconds_total }
              origin: { $ref: '#/components/schemas/MetricOrigin' }
              kind: { $ref: '#/components/schemas/MetricKind' }
              series: { type: integer, description: How many series the name has. }
              machines: { type: array, items: { type: string } }
              roles: { type: array, items: { type: string } }
              containers: { type: array, items: { type: string }, description: Containers the series come from (none for the workload). }
    RunMetricSeries:
      type: object
      required: [window, name, fn, labels, total, truncated, series]
      properties:
        window:
          type: object
          required: [start, end]
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
            segment: { type: string }
        name: { type: string }
        fn: { $ref: '#/components/schemas/MetricSeriesFn' }
        labels: { type: array, items: { type: string }, description: The metric's own labels — what it can be grouped by besides machine and container. }
        total: { type: integer, description: Series before the cut. }
        truncated: { type: boolean, description: Only the series with the highest average are returned. }
        series:
          type: array
          items:
            type: object
            required: [labels, points]
            properties:
              labels: { type: object, additionalProperties: { type: string } }
              machine: { type: string }
              role: { type: string }
              container: { type: string }
              points:
                type: array
                items:
                  type: array
                  description: '[unix_ms, value]'
                  items: { type: number }
                  minItems: 2
                  maxItems: 2
              aggregates:
                type: object
                properties:
                  avg: { type: number }
                  min: { type: number }
                  max: { type: number }
                  last: { type: number }
                  p95: { type: number }
    RunMetrics:
      type: object
      required: [window, series]
      properties:
        window:
          type: object
          required: [start, end]
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
            segment: { type: string }
        series:
          type: array
          items:
            type: object
            required: [key, points]
            properties:
              key: { type: string }
              title: { type: string }
              unit: { type: string }
              role: { type: string }
              machine: { type: string }
              points:
                type: array
                items:
                  type: array
                  description: '[unix_ms, value]'
                  items: { type: number }
                  minItems: 2
                  maxItems: 2
              aggregates:
                type: object
                properties:
                  avg: { type: number }
                  min: { type: number }
                  max: { type: number }
                  last: { type: number }
                  p95: { type: number }
        errors:
          type: array
          description: Per-key backend errors; other series are still returned.
          items:
            type: object
            properties:
              key: { type: string }
              error: { type: string }
    GrafanaSession:
      type: object
      required: [expires_at, dashboards]
      properties:
        expires_at: { type: string, format: date-time }
        dashboards:
          type: array
          items:
            type: object
            required: [id, title, url]
            properties:
              id: { type: string }
              title: { type: string }
              url: { type: string, description: Same-origin `/grafana/...` URL with from/to preset. }
              per_machine: { type: boolean }
    Artifact:
      type: object
      required: [id, name, kind, size_bytes]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [stroppy_raw, report, config, log_bundle, other] }
        content_type: { type: string }
        size_bytes: { type: integer }
        digest: { type: string }
        created_at: { type: string, format: date-time }
    CompareRequest:
      type: object
      required: [run_ids]
      properties:
        run_ids:
          type: array
          items: { type: string, format: uuid }
          minItems: 2
          maxItems: 16
        baseline_run_id: { type: string, format: uuid, description: Defaults to the first id. }
        metric_keys:
          type: array
          items: { type: string }
        deadband_pct: { type: number, default: 1 }
    Comparison:
      type: object
      required: [columns, metrics, spec_diff]
      properties:
        baseline_run_id: { type: string, format: uuid }
        columns:
          type: array
          items:
            type: object
            required: [run_id]
            properties:
              run_id: { type: string, format: uuid }
              name: { type: string }
              status: { $ref: '#/components/schemas/RunStatus' }
              summary: { $ref: '#/components/schemas/RunSummary' }
              started_at: { type: string, format: date-time }
              duration: { type: string }
              verdict:
                type: object
                properties:
                  better: { type: integer }
                  worse: { type: integer }
                  same: { type: integer }
                  missing: { type: integer }
        metrics:
          type: array
          items:
            type: object
            required: [key, cells]
            properties:
              key: { type: string }
              title: { type: string }
              unit: { type: string }
              group: { type: string }
              higher_is_better: { type: boolean }
              cells:
                type: array
                items:
                  type: object
                  required: [run_id, present]
                  properties:
                    run_id: { type: string, format: uuid }
                    present: { type: boolean }
                    value: { type: number }
                    diff_pct: { type: number }
                    verdict: { type: string, enum: [better, worse, same, baseline] }
        spec_diff:
          type: object
          description: Per run (vs baseline) — field-level differences in database/workload/sizes/configs.
          additionalProperties: { $ref: '#/components/schemas/Diff' }
