components:
  schemas:
    DatabaseKind:
      type: string
      description: >-
        A database kind. Adding a kind is a code change: the server list (internal/domain/dbkind) and this enum are kept equal by a test.
      enum:
        - "postgres"
        - "orioledb"
        - "mysql"
        - "mariadb"
        - "picodata"
        - "ydb"
        - "ydb_managed"
        - "cockroach"
        - "pg_noop"
        - "noop"
        - "external"
        - "custom"
    TuningMode:
      type: string
      description: >-
        The database's tuning: auto sizes the engine's settings from the machine, role, topology and workload; stock keeps the engine's defaults.
      enum:
        - "auto"
        - "stock"
    CommitDurability:
      type: string
      description: >-
        What an acknowledged commit waits for: its log on disk (fsync, or a quorum of replicas that each synced), or nothing (relaxed — a machine crash can lose the last commits).
      enum:
        - "fsync_each_commit"
        - "relaxed"
    TopologyRole:
      type: string
      description: >-
        The role of a machine or container in a database topology.
      enum:
        - "db"
        - "db-replica"
        - "db-compute"
        - "etcd"
        - "proxy"
        - "runner"
        - "coordinator"
        - "patroni"
        - "patroni-replica"
        - "pgbouncer"
    RunEventKind:
      type: string
      description: >-
        A run timeline event: Graphene's run lifecycle (run-*), a failed step (activity-*), or a pipeline milestone.
      enum:
        - "run-started"
        - "run-completed"
        - "run-failed"
        - "run-timed-out"
        - "run-terminated"
        - "run-cancelled"
        - "activity-failed"
        - "activity-timed-out"
        - "phase.started"
        - "phase.finished"
        - "phase.failed"
        - "machine.ready"
        - "container.ready"
        - "segment.started"
        - "segment.finished"
        - "segment.failed"
        - "baseline.started"
        - "baseline.finished"
        - "stand.kept"
        - "result.published"
        - "network.checked"
    AuditAction:
      type: string
      description: >-
        What an audit entry records.
      enum:
        - "admin.pipelines.resync"
        - "admin.run.cancel"
        - "admin.settings.update"
        - "admin.tenant.assign_owner"
        - "admin.tenant.delete"
        - "admin.tenant.resume"
        - "admin.tenant.suspend"
        - "admin.user.platform_admin"
        - "database.create"
        - "database.delete"
        - "database.update"
        - "invite.accept"
        - "invite.create"
        - "invite.revoke"
        - "member.leave"
        - "member.remove"
        - "member.role"
        - "provider.create"
        - "provider.delete"
        - "provider.update"
        - "run.cancel"
        - "run.delete"
        - "run.keep.extend"
        - "run.keep.release"
        - "run.launch"
        - "run.update"
        - "schedule.create"
        - "schedule.delete"
        - "schedule.update"
        - "share.create"
        - "share.rebuild"
        - "share.revoke"
        - "suite.create"
        - "suite.delete"
        - "suite.launch"
        - "suite.update"
        - "suite_run.cancel"
        - "suite_run.delete"
        - "tenant.create"
        - "tenant.delete"
        - "tenant.transfer"
        - "tenant.update"
        - "test.create"
        - "test.delete"
        - "test.update"
        - "token.create"
        - "token.revoke"
        - "webhook.create"
        - "webhook.delete"
        - "webhook.rotate"
        - "webhook.update"
        - "workload.create"
        - "workload.delete"
        - "workload.update"
    AuditTargetKind:
      type: string
      description: >-
        The kind of object an audit entry is about.
      enum:
        - "database"
        - "invite"
        - "namespace"
        - "provider"
        - "run"
        - "schedule"
        - "share"
        - "suite"
        - "suite_run"
        - "system_settings"
        - "tenant"
        - "test"
        - "token"
        - "user"
        - "webhook"
        - "workload"
    MetricKey:
      type: string
      description: >-
        A metric of the catalog.
      enum:
        - "tps"
        - "qps"
        - "latency_p50_ms"
        - "latency_p95_ms"
        - "latency_p99_ms"
        - "errors"
        - "iterations_total"
        - "iterations_per_second"
        - "queries_per_second"
        - "failed_iterations_total"
        - "failed_queries_total"
        - "iteration_duration_avg"
        - "iteration_duration_p90"
        - "iteration_duration_p99"
        - "load_duration_seconds"
        - "node_cpu_usage"
        - "node_memory_used_bytes"
        - "node_disk_io_bytes"
        - "node_network_bytes"
        - "pg_stat_database_xact_commit"
        - "pg_stat_database_xact_rollback"
        - "pg_stat_database_blks_hit_ratio"
        - "pg_stat_activity_count"
        - "pg_locks_count"
        - "pg_replication_lag_seconds"
