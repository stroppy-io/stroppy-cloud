        - "cockroach_sql_service_latency_p99"
        - "cockroach_live_nodes"
        - "picodata_instances_online"
    MetricGroup:
      type: string
      description: >-
        The group a metric is shown under; a database group reads as the product name.
      enum:
        - "Headline"
        - "Workload"
        - "Bootstrap"
        - "Host"
        - "PostgreSQL"
        - "MySQL"
        - "CockroachDB"
        - "Picodata"
    QuotaName:
      type: string
      description: >-
        A provider quota the quotas pipeline reports (Yandex Cloud Quota Manager ids, AWS Service Quotas names).
      enum:
        - "compute.instances.count"
        - "compute.instanceCores.count"
        - "compute.instanceMemory.size"
        - "compute.ssdDisks.size"
        - "compute.hddDisks.size"
        - "compute.ssdNonReplicatedDisks.size"
        - "compute.ssdIOM3Disks.size"
        - "compute.instanceHighFreqCores.count"
        - "compute.disks.count"
        - "vpc.networks.count"
        - "vpc.subnets.count"
        - "vpc.securityGroups.count"
        - "vpc.externalStaticAddresses.count"
        - "vpc.externalAddresses.count"
        - "ec2.standard.vcpus"
        - "ec2.spot.standard.vcpus"
        - "ebs.gp3.storage"
        - "ebs.gp2.storage"
        - "ebs.io2.storage"
        - "vpc.vpcs"
        - "vpc.security_groups"
        - "vpc.internet_gateways"
        - "ec2.elastic_ips"
    QuotaUnit:
      type: string
      description: >-
        The unit of a provider quota.
      enum:
        - "instances"
        - "cores"
        - "bytes"
        - "disks"
        - "networks"
        - "subnets"
        - "security-groups"
        - "addresses"
        - "vcpus"
        - "tib"
        - "vpcs"
        - "groups"
        - "gateways"
    LogLevel:
      type: string
      description: >-
        A log line level, normalized from the source severity.
      enum:
        - "trace"
        - "debug"
        - "info"
        - "warn"
        - "error"
        - "fatal"
    ConnectivityOutcome:
      type: string
      description: >-
        How a TCP dial of the run's connectivity check ended: ok — connected;
        refused — the machine answered that nothing listens on the port;
        timeout — no answer within the dial timeout (a dropped SYN: firewall,
        security group, routing); other — any other failure (no route, the
        check could not run on the machine).
      enum:
        - "ok"
        - "refused"
        - "timeout"
        - "other"
    RunStageKind:
      type: string
      description: >-
        What a running workload segment does: `preparing` — stroppy prepares the
        data (schema, load, indexes, checks), which has no planned length;
        `load` — the planned load runs.
      enum:
        - "preparing"
        - "load"
    ErrorReason:
