        rendered software configs.
    ShareCreate:
      type: object
      properties:
        ttl:
          type: string
          description: Go duration; default 7d; `0s` = never expires.
        scope:
          $ref: '#/components/schemas/ShareScope'
        title:
          type: string
          maxLength: 256
    Share:
      type: object
      required:
      - id
      - token
      - url
      - target
      - scope
      - created_at
      - active
      properties:
        id:
          type: string
          format: uuid
        token:
          type: string
        url:
          type: string
          format: uri
        target:
          type: object
          required:
          - kind
          - id
          properties:
            kind:
              $ref: '#/components/schemas/ShareTargetKind'
            id:
              type: string
              format: uuid
            name:
              type: string
            run_ids:
              type: array
              items:
                type: string
                format: uuid
              description: For comparisons.
        scope:
          $ref: '#/components/schemas/ShareScope'
        title:
          type: string
        active:
          type: boolean
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
        captured_at:
          type: string
          format: date-time
        view_count:
          type: integer
        created_by:
          $ref: '#/components/schemas/UserRef'
        created_at:
          type: string
          format: date-time
    ShareSnapshot:
      type: object
      required:
      - kind
      - captured_at
      - scope
      properties:
        kind:
          $ref: '#/components/schemas/ShareTargetKind'
        scope:
          $ref: '#/components/schemas/ShareScope'
        title:
          type: string
        captured_at:
          type: string
          format: date-time
        tenant_name:
          type: string
        run:
          $ref: '#/components/schemas/SharedRun'
        suite_run:
          type: object
          properties:
            name:
              type: string
            status:
              $ref: '#/components/schemas/RunStatus'
            cells:
              type: array
              items:
                $ref: '#/components/schemas/SharedRun'
            summary:
              $ref: '#/components/schemas/SuiteRunSummary'
        comparison:
          $ref: '#/components/schemas/Comparison'
    SharedRun:
