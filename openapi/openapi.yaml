              cpu:
                type: integer
              memory_gb:
                type: integer
              disk_gb:
                type: integer
              disk_type:
                type: string
              instance_type:
                type: string
              location:
                type: string
        configs:
          type: object
          description: Scope `configs` — rendered files per role (secret fields masked).
