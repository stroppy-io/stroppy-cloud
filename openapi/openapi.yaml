    RatingPage:
      type: object
      required:
      - metric
      - data
      - meta
      properties:
        metric:
          $ref: '#/components/schemas/MetricDef'
        leagues:
          type: array
          items:
            type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/RatingEntry'
        meta:
          $ref: '#/components/schemas/PageMeta'
    ShareTargetKind:
      type: string
      enum:
      - run
      - suite_run
      - comparison
    ShareScope:
      type: string
      enum:
      - overview
      - metrics
      - configs
