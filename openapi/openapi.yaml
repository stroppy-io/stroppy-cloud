    ResourceTree:
      type: object
      description: 'A record of the run with what it owns and what it talks to — the run''s topology,
        drawn from one call: nodes are the records (machines, containers, agents, artifacts), edges are
        their declared flows. A finished run keeps its records here, with phase `deleted`.'
      required:
      - ref
      - kind
      properties:
        ref:
          type: string
        kind:
          type: string
        phase:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
          description: Record markers. A container of a run carries `container`, `role`, `machine` and
            `kind` (database, proxy, coordinator, exporter, addon); an agent carries `role` and `machine`.
        flows:
          type: array
          description: Declared outgoing edges of this record (intent, not observed traffic).
          items:
            type: object
            required:
            - to
            properties:
              to:
                type: string
                description: Target record ref ("docker/<run>-db-1-postgres") or an external endpoint.
              protocol:
                type: string
                description: tcp, http, grpc, otlp, prometheus_pull, … — an open vocabulary.
              port:
                type: integer
              label:
                type: string
              virtual:
                type: boolean
                description: A system edge that always exists (agent↔server)
                not one the run declared.: null
        keep_until:
          type:
          - string
          - 'null'
          format: date-time
        children:
          type: array
          items:
            $ref: '#/components/schemas/ResourceTree'
    RunEvent:
      type: object
      required:
      - id
      - at
      - kind
      - title
      properties:
        id:
          type: string
        at:
          type: string
          format: date-time
        kind:
          type: string
          example: segment.finished
          description: run.*, phase.*, segment.*, machine.*, component.*, activity.*
        title:
          type: string
        subject:
          type: string
          description: Graphene ref or role/machine.
        status:
          type: string
        error:
          type: string
        attempt:
          type: integer
        payload:
          type: object
          additionalProperties: true
        log_ref:
          type: object
          description: Deep link into the logs.
          properties:
            filter:
              type: object
              additionalProperties: true
            cursor:
              type: string
    LogLine:
      type: object
      required:
      - time
      - message
      properties:
        time:
          type: string
          format: date-time
        seq:
          type: integer
        message:
          type: string
        level:
          type: string
        stream:
          type: string
        role:
          type: string
        machine:
          type: string
        container:
          type: string
        phase:
          type: string
        segment:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
    LogPage:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LogLine'
        older:
          type:
          - string
          - 'null'
          description: Cursor towards the past.
        newer:
          type:
          - string
          - 'null'
          description: Cursor towards the present.
        truncated:
          type: boolean
    RunMetrics:
      type: object
      required:
      - window
      - series
      properties:
        window:
          type: object
          required:
          - start
          - end
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
            segment:
              type: string
        series:
          type: array
          items:
            type: object
            required:
            - key
            - points
            properties:
              key:
                type: string
              title:
                type: string
              unit:
                type: string
              role:
                type: string
              machine:
                type: string
              points:
                type: array
                items:
                  type: array
                  description: '[unix_ms, value]'
                  items:
                    type: number
                  minItems: 2
                  maxItems: 2
              aggregates:
                type: object
                properties:
                  avg:
                    type: number
                  min:
                    type: number
                  max:
                    type: number
                  last:
                    type: number
                  p95:
                    type: number
        errors:
          type: array
          description: Per-key backend errors; other series are still returned.
          items:
            type: object
            properties:
              key:
                type: string
              error:
                type: string
    GrafanaSession:
      type: object
      required:
      - expires_at
      - dashboards
      properties:
        expires_at:
          type: string
          format: date-time
        dashboards:
          type: array
          items:
            type: object
            required:
            - id
            - title
            - url
            properties:
              id:
                type: string
              title:
                type: string
              url:
                type: string
                description: Same-origin `/grafana/...` URL with from/to preset.
              per_machine:
                type: boolean
    Artifact:
      type: object
      required:
      - id
      - name
      - kind
      - size_bytes
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum:
          - stroppy_raw
          - report
          - config
          - log_bundle
          - other
        content_type:
          type: string
        size_bytes:
          type: integer
        digest:
          type: string
        created_at:
          type: string
          format: date-time
    CompareRequest:
      type: object
      required:
      - run_ids
      properties:
        run_ids:
          type: array
          items:
            type: string
            format: uuid
          minItems: 2
          maxItems: 16
        baseline_run_id:
          type: string
          format: uuid
          description: Defaults to the first id.
        metric_keys:
          type: array
          items:
            type: string
        deadband_pct:
          type: number
          default: 1
    Comparison:
      type: object
      required:
      - columns
      - metrics
      - spec_diff
      properties:
        baseline_run_id:
          type: string
          format: uuid
        columns:
          type: array
          items:
            type: object
            required:
            - run_id
            properties:
              run_id:
                type: string
                format: uuid
              name:
                type: string
              status:
                $ref: '#/components/schemas/RunStatus'
              summary:
                $ref: '#/components/schemas/RunSummary'
              started_at:
                type: string
                format: date-time
              duration:
                type: string
              verdict:
                type: object
                properties:
                  better:
                    type: integer
                  worse:
                    type: integer
                  same:
                    type: integer
                  missing:
                    type: integer
        metrics:
          type: array
          items:
            type: object
            required:
            - key
            - cells
            properties:
              key:
                type: string
              title:
                type: string
              unit:
                type: string
              group:
                type: string
              higher_is_better:
                type: boolean
              cells:
                type: array
                items:
                  type: object
                  required:
                  - run_id
                  - present
                  properties:
                    run_id:
                      type: string
                      format: uuid
                    present:
                      type: boolean
                    value:
                      type: number
                    diff_pct:
                      type: number
                    verdict:
                      type: string
                      enum:
                      - better
                      - worse
                      - same
                      - baseline
        spec_diff:
          type: object
          description: Per run (vs baseline) — field-level differences in database/workload/sizes/configs.
          additionalProperties:
            $ref: '#/components/schemas/Diff'
    SuiteAxes:
      type: object
      description: Variation axes; the cell set is the product of tests × non-empty axes.
      properties:
        provider_profiles:
          type: array
          items:
            type: string
            format: uuid
        sizes:
          type: array
          items:
            $ref: '#/components/schemas/RoleSizes'
        database_versions:
          type: array
          items:
            type: string
        workload_variants:
          type: array
          description: Overrides applied to every segment.
          items:
            type: object
            properties:
              name:
                type: string
              vus:
                type: integer
              scale_factor:
                type: integer
              duration:
                type: string
              params:
                type: object
                additionalProperties: true
    SuiteCell:
      type: object
      required:
      - id
      - test
      - enabled
      properties:
        id:
          type: string
          description: Stable id derived from test + axis values.
        name:
          type: string
        test:
          $ref: '#/components/schemas/Ref'
        enabled:
          type: boolean
        axis:
          type: object
          description: Axis values this cell was generated from.
          properties:
            provider_profile_id:
              type: string
              format: uuid
            sizes:
              $ref: '#/components/schemas/RoleSizes'
            database_version:
              type: string
            workload_variant:
              type: string
        overrides:
          $ref: '#/components/schemas/LaunchOverrides'
        generated:
          type: boolean
          readOnly: true
          description: false when added manually.
        validation:
          $ref: '#/components/schemas/Fit'
    SuiteSpec:
      type: object
      properties:
        tests:
          type: array
          items:
            oneOf:
            - type: object
              required:
              - ref
              properties:
                ref:
                  $ref: '#/components/schemas/Ref'
            - type: object
              required:
              - inline
              properties:
                inline:
                  $ref: '#/components/schemas/TestWrite'
        axes:
          $ref: '#/components/schemas/SuiteAxes'
        cells:
          type: array
          description: Manual edits over the generated set (disable, override, add).
          items:
            $ref: '#/components/schemas/SuiteCell'
        concurrency:
          type: integer
          minimum: 1
          default: 1
        defaults:
          type: object
          properties:
            rating:
              $ref: '#/components/schemas/RatingFlags'
            keep:
              type: string
    Suite:
      allOf:
      - $ref: '#/components/schemas/Entity'
      - $ref: '#/components/schemas/SuiteSpec'
      - type: object
        properties:
          computed_cells:
            type: array
            readOnly: true
            items:
              $ref: '#/components/schemas/SuiteCell'
          summary:
            type: object
            readOnly: true
            properties:
              cell_count:
                type: integer
              enabled_cell_count:
                type: integer
              last_run:
                $ref: '#/components/schemas/RunRef'
              run_count:
                type: integer
              schedules:
                type: array
                items:
                  $ref: '#/components/schemas/Ref'
    SuiteWrite:
      allOf:
      - type: object
        required:
        - name
        properties:
          name:
            type: string
            minLength: 1
            maxLength: 128
          description:
            type: string
          tags:
            type: object
            additionalProperties:
              type: string
      - $ref: '#/components/schemas/SuiteSpec'
    SuitePatch:
      allOf:
      - $ref: '#/components/schemas/EntityPatch'
      - $ref: '#/components/schemas/SuiteSpec'
    SuitePreview:
      type: object
      required:
      - cells
      - validation
      properties:
        cells:
          type: array
          items:
            $ref: '#/components/schemas/SuiteCell'
        validation:
          $ref: '#/components/schemas/Fit'
        totals:
          type: object
          properties:
            machines:
              type: integer
            cpu:
              type: integer
            memory_gb:
              type: integer
            disk_gb:
              type: integer
            estimated_duration:
              type: string
        quota_check:
          type: array
          items:
            type: object
            properties:
              provider_profile_id:
                type: string
                format: uuid
              fits:
                type: boolean
              issues:
                type: array
                items:
                  type: string
    SuiteLaunch:
      type: object
      properties:
        name:
          type: string
        concurrency:
          type: integer
          minimum: 1
        cell_ids:
          type: array
          description: Subset of enabled cells; all when omitted.
          items:
            type: string
        rating:
          $ref: '#/components/schemas/RatingFlags'
        keep:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
    SuiteRun:
      type: object
      required:
      - id
      - name
      - suite
      - status
      - trigger
      - cells
      - progress
      - author
      - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        suite:
          $ref: '#/components/schemas/Ref'
        status:
          $ref: '#/components/schemas/RunStatus'
        trigger:
          $ref: '#/components/schemas/Trigger'
        trigger_ref:
          type: object
          properties:
            schedule_id:
              type: string
              format: uuid
            retry_of:
              type: string
              format: uuid
        concurrency:
          type: integer
        progress:
          type: object
          required:
          - total
          - done
          - failed
          - running
          - pending
          properties:
            total:
              type: integer
            done:
              type: integer
            failed:
              type: integer
            running:
              type: integer
            pending:
              type: integer
            cancelled:
              type: integer
            pct:
              type: number
        cells:
          type: array
          items:
            type: object
            required:
            - cell_id
            - status
            properties:
              cell_id:
                type: string
              name:
                type: string
              run:
                $ref: '#/components/schemas/RunRef'
              status:
                $ref: '#/components/schemas/RunStatus'
              summary:
                $ref: '#/components/schemas/RunSummary'
        author:
          $ref: '#/components/schemas/UserRef'
        labels:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
        duration:
          type:
          - string
          - 'null'
        graphene:
          type: object
          readOnly: true
          properties:
            run_ref:
              type: string
    SuiteRunSummary:
      type: object
      required:
      - suite_run_id
      - rows
      properties:
        suite_run_id:
          type: string
          format: uuid
        compared_to:
          type:
          - string
          - 'null'
          format: uuid
        metric_keys:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: object
            required:
            - cell_id
            properties:
              cell_id:
                type: string
              name:
                type: string
              run:
                $ref: '#/components/schemas/RunRef'
              status:
                $ref: '#/components/schemas/RunStatus'
              metrics:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    value:
                      type: number
                    previous:
                      type: number
                    diff_pct:
                      type: number
                    verdict:
                      type: string
                      enum:
                      - better
                      - worse
                      - same
                      - missing
    Schedule:
      type: object
      required:
      - id
      - name
      - target
      - cron
      - timezone
      - enabled
      - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        target:
          $ref: '#/components/schemas/ScheduleTarget'
        cron:
          type: string
          example: 0 3 * * *
        timezone:
          type: string
          example: Europe/Moscow
        enabled:
          type: boolean
        overrides:
          $ref: '#/components/schemas/LaunchOverrides'
        next_run_at:
          type:
          - string
          - 'null'
          format: date-time
        last_run:
          $ref: '#/components/schemas/ScheduleRunRef'
        author:
          $ref: '#/components/schemas/UserRef'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ScheduleTarget:
      type: object
      required:
      - kind
      - id
      properties:
        kind:
          type: string
          enum:
          - test
          - suite
        id:
          type: string
          format: uuid
        name:
          type: string
          readOnly: true
    ScheduleWrite:
      type: object
      required:
      - name
      - target
      - cron
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        target:
          $ref: '#/components/schemas/ScheduleTarget'
        cron:
          type: string
        timezone:
          type: string
          default: UTC
        enabled:
          type: boolean
          default: true
        overrides:
          $ref: '#/components/schemas/LaunchOverrides'
    SchedulePatch:
      type: object
      properties:
        name:
          type: string
        target:
          $ref: '#/components/schemas/ScheduleTarget'
        cron:
          type: string
        timezone:
          type: string
        enabled:
          type: boolean
        overrides:
          $ref: '#/components/schemas/LaunchOverrides'
    ScheduleRunRef:
      type: object
      required:
      - kind
      - id
      - status
      - at
      properties:
        kind:
          type: string
          enum:
          - run
          - suite_run
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          $ref: '#/components/schemas/RunStatus'
        at:
          type: string
          format: date-time
        error:
          type: string
          description: Set when the firing itself failed (e.g. limits).
    RatingEntry:
      type: object
      required:
      - rank
      - value
      - unit
      - db_kind
      - league
      - run_at
      properties:
        rank:
          type: integer
        value:
          type: number
        unit:
          type: string
        db_kind:
          $ref: '#/components/schemas/DatabaseKind'
        db_version:
          type: string
        topology_label:
          type: string
        node_count:
          type: integer
        sizes:
          $ref: '#/components/schemas/RoleSizes'
        league:
          type: string
        workload_name:
          type: string
        script:
          type: string
        stroppy_version:
          type: string
        provider_kind:
          $ref: '#/components/schemas/ProviderKind'
        run_at:
          type: string
          format: date-time
        run_id:
          type: string
          format: uuid
          description: Tenant rating only.
        author:
          $ref: '#/components/schemas/UserRef'
          description: Tenant rating only.
        tenant_name:
          type: string
          description: Global rating; only when the tenant set `public_name`.
        share_token:
          type: string
