      - name
      - status
      - summary
      - timeline
      properties:
        name:
          type: string
        status:
          $ref: '#/components/schemas/RunStatus'
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        duration:
          type: string
        summary:
          $ref: '#/components/schemas/RunSummary'
        result:
          $ref: '#/components/schemas/RunResult'
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/RunEvent'
        topology:
          $ref: '#/components/schemas/TopologyPreview'
        database:
          type: object
          properties:
            kind:
              $ref: '#/components/schemas/DatabaseKind'
            version:
              type: string
            image:
              type: string
            params:
              $ref: '#/components/schemas/SchemaValue'
        workload:
          type: object
          properties:
            stroppy_version:
              type: string
            protocol:
              $ref: '#/components/schemas/Protocol'
            segments:
