info:
  title: Stroppy Cloud API
  version: 1.0.0
  x-pipeline-contract-version: 1.0.0
  summary: Database benchmarking as a service — product server over Graphene CI.
  description: "The Stroppy Cloud HTTP API. The server owns tenants, the benchmark\nlibrary (databases,\
    \ workloads, tests), runs and their results; provisioning,\nagents and observability are Graphene's;\
    \ identity is IAM's.\n\nNamespaces:\n  - `/api/v1/public/...`      no auth\n  - `/api/v1/me`, `/api/v1/tenants`\
    \   caller scope\n  - `/api/v1/t/{slug}/...`    tenant scope (membership required)\n  - `/api/v1/catalog/...`\
    \     read-only reference data (any authenticated caller)\n  - `/api/v1/admin/...`       platform\
    \ admin\n  - `/api/v1/ws`              one WebSocket for every live stream (see README)\n\nAuthentication:\
    \ `Authorization: Bearer <token>` where token is either an IAM\naccess token (people) or a Stroppy\
    \ API token (`stc_...`, personal or tenant\nservice token). IAM itself is reverse-proxied same-origin\
    \ under `/v1/*`.\n\nErrors: RFC 9457 `application/problem+json` with a stable machine `code`;\ndomain\
    \ validation failures carry `validation` — a schemapb\n`ValidationResult` (protoJSON) with per-field\
    \ `path`/`code`.\n\nForms: any request field marked `x-schema: <id>` is a schemapb value; fetch\n\
    the schema from `/api/v1/catalog/schemas/{id}` and validate with\n`/api/v1/catalog/schemas/{id}:validate`.\
    \ One validation on every door.\n"
  license:
    name: Proprietary
