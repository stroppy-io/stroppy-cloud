      summary: Revoke (link stops working immediately).
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/t/{slug}/shares/{id}:rebuild:
    post:
      operationId: rebuildShare
      tags:
      - Shares
      parameters:
      - $ref: '#/components/parameters/slug'
      - $ref: '#/components/parameters/id'
      summary: Re-capture the snapshot from the current state of the target.
      responses:
        '200':
          description: Share.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/t/{slug}/rating:
    get:
      operationId: getTenantRating
      tags:
      - Rating
      parameters:
      - $ref: '#/components/parameters/slug'
      - $ref: '#/components/parameters/ratingMetric'
      - $ref: '#/components/parameters/ratingKind'
      - $ref: '#/components/parameters/ratingVersion'
      - $ref: '#/components/parameters/ratingProvider'
      - $ref: '#/components/parameters/ratingStroppy'
      - $ref: '#/components/parameters/ratingLeague'
      - $ref: '#/components/parameters/ratingPeriod'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/limit'
      summary: Tenant rating (runs opted into `rating.tenant`).
      responses:
        '200':
          description: Rating page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingPage'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/t/{slug}/dashboard:
    get:
      operationId: getTenantDashboard
      tags:
      - Rating
      parameters:
      - $ref: '#/components/parameters/slug'
      summary: Tenant home — counters, recent runs/suite runs, upcoming schedules, top results.
      responses:
        '200':
          description: Dashboard.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantDashboard'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/admin/status:
    get:
      operationId: getAdminStatus
      tags:
      - Admin
      summary: Platform status — versions, dependencies, pipeline push state per namespace, global run
        queue.
      responses:
        '200':
          description: Status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStatus'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/admin/pipelines:resync:
    post:
      operationId: resyncPipelines
      tags:
      - Admin
      summary: Re-push the pipelines into one or all tenant namespaces.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tenant_slug:
                  type: string
                  description: All tenants when omitted.
      responses:
        '202':
          description: Started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  namespaces:
                    type: array
                    items:
                      type: string
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/admin/tenants:
    get:
      operationId: adminListTenants
      tags:
      - Admin
      parameters:
      - $ref: '#/components/parameters/search'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - active
          - orphaned
          - suspended
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/limit'
      summary: All tenants.
      responses:
        '200':
          description: Page.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminTenant'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/admin/tenants/{slug}:
    get:
      operationId: adminGetTenant
      tags:
      - Admin
      parameters:
      - $ref: '#/components/parameters/slug'
      summary: Tenant details.
      responses:
        '200':
          description: Tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTenant'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: adminDeleteTenant
      tags:
      - Admin
      parameters:
      - $ref: '#/components/parameters/slug'
      summary: Delete a tenant (cancels live runs first).
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/admin/tenants/{slug}:suspend:
    post:
      operationId: adminSuspendTenant
      tags:
      - Admin
      parameters:
      - $ref: '#/components/parameters/slug'
      summary: Suspend — no new launches, schedules paused.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTenant'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/admin/tenants/{slug}:resume:
    post:
      operationId: adminResumeTenant
      tags:
      - Admin
      parameters:
      - $ref: '#/components/parameters/slug'
      summary: Resume.
      responses:
        '200':
          description: Tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTenant'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/admin/tenants/{slug}/limits:
    put:
      operationId: adminSetTenantLimits
      tags:
      - Admin
      parameters:
      - $ref: '#/components/parameters/slug'
      summary: Set tenant limit ceilings (null = platform default).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantLimitsWrite'
      responses:
        '200':
          description: Limits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantLimits'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/admin/tenants/{slug}:assign-owner:
    post:
      operationId: adminAssignOwner
      tags:
      - Admin
      parameters:
      - $ref: '#/components/parameters/slug'
      summary: Assign an owner to an orphaned tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - user_id
              properties:
                user_id:
                  type: string
      responses:
        '200':
          description: Tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTenant'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/admin/users:
    get:
      operationId: adminListUsers
      tags:
      - Admin
      parameters:
      - $ref: '#/components/parameters/search'
      - name: platform_admin
        in: query
        schema:
          type: boolean
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/limit'
      summary: Profiles known to the server.
      responses:
        '200':
          description: Page.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminUser'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/admin/users/{userId}:
    patch:
      operationId: adminPatchUser
      tags:
      - Admin
      parameters:
      - $ref: '#/components/parameters/userId'
      summary: Toggle platform admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_platform_admin:
                  type: boolean
      responses:
        '200':
          description: User.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/admin/settings:
    get:
      operationId: getSystemSettings
      tags:
      - Admin
      summary: System settings.
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSettings'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: patchSystemSettings
      tags:
      - Admin
      summary: Update system settings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemSettingsPatch'
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSettings'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/admin/runs:
    get:
      operationId: adminListRuns
      tags:
      - Admin
      parameters:
      - name: status
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/RunStatus'
      - name: tenant
        in: query
        schema:
          type: string
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/limit'
      summary: Runs across all tenants (queue view).
      responses:
        '200':
          description: Page.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                      - $ref: '#/components/schemas/Run'
                      - type: object
                        properties:
                          tenant:
                            $ref: '#/components/schemas/Ref'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/admin/runs/{id}:cancel:
    post:
      operationId: adminCancelRun
      tags:
      - Admin
      parameters:
      - $ref: '#/components/parameters/id'
      summary: Cancel any run.
      responses:
        '200':
          description: Run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/admin/audit:
    get:
      operationId: adminListAudit
      tags:
      - Admin
      parameters:
      - name: tenant
        in: query
        schema:
          type: string
      - name: action
        in: query
        schema:
          type: string
      - name: actor
        in: query
        schema:
          type: string
      - name: since
        in: query
        schema:
          type: string
          format: date-time
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/limit'
      summary: Platform audit log.
      responses:
        '200':
          description: Audit page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: IAM access token (JWT) or Stroppy API token (`stc_...`).
  parameters:
    slug:
      name: slug
      in: path
      required: true
      description: Tenant slug.
      schema:
        type: string
        pattern: ^[a-z0-9][a-z0-9-]{1,62}$
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 1024
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    order:
      name: order
      in: query
      schema:
        type: string
        enum:
        - asc
        - desc
        default: desc
    search:
      name: search
      in: query
      description: Free-text search over name and description.
      schema:
        type: string
        maxLength: 256
    tags:
      name: tags
      in: query
      description: Comma-separated `key=value` or bare `key` label filters.
      schema:
        type: string
        maxLength: 1024
    author:
      name: author
      in: query
      schema:
        type: string
        description: User id (IAM `sub`).
    favorites:
      name: favorites
      in: query
      schema:
        type: boolean
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: string
    shareToken:
      name: token
      in: path
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 128
    exportFormat:
      name: format
      in: query
      required: true
      schema:
        type: string
        enum:
        - md
        - pdf
        - json
        - csv
    windowStart:
      name: start
      in: query
      schema:
        type: string
        format: date-time
    windowEnd:
      name: end
      in: query
      schema:
        type: string
        format: date-time
    exampleId:
      name: exampleId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z0-9][a-z0-9-]*$
    schemaId:
      name: schemaId
      in: path
      required: true
      description: '`<namespace>.<name>` or `<namespace>.<name>@<version>` (latest when no version).'
      schema:
        type: string
        example: cfg.postgresql.conf@16
    diffA:
      name: a
      in: query
      required: true
      schema:
        type: string
        format: uuid
    diffB:
      name: b
      in: query
      required: true
      schema:
        type: string
        format: uuid
    favoriteKind:
      name: kind
      in: path
      required: true
      schema:
        type: string
        enum:
        - database
        - workload
        - test
        - run
        - suite
        - suite_run
        - schedule
    ratingMetric:
      name: metric
      in: query
      schema:
        type: string
        default: tps
    ratingKind:
      name: kind
      in: query
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/DatabaseKind'
    ratingVersion:
      name: version
      in: query
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    ratingProvider:
      name: provider
      in: query
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/ProviderKind'
    ratingStroppy:
      name: stroppy_version
      in: query
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    ratingLeague:
      name: league
      in: query
      description: Size league (`db:M`); all leagues when omitted.
      schema:
        type: string
    ratingPeriod:
      name: period
      in: query
      schema:
        type: string
        enum:
        - 7d
        - 30d
        - 90d
        - 1y
        - all
        default: all
  responses:
    Problem:
      description: Error (RFC 9457).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NoContent:
      description: Done.
  schemas:
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - code
      properties:
        type:
          type: string
          format: uri
          description: Problem type URI.
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Stable machine-readable code. Branch on this, never on `detail`.
          example: test_not_ready
        request_id:
          type: string
        validation:
          $ref: '#/components/schemas/ValidationResult'
    ValidationResult:
      type: object
      description: Schema and execution diagnostics. Warnings are nonblocking; branch on code and severity,
        never message.
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    ValidationError:
      type: object
      required:
      - path
      - code
      properties:
        scope:
          $ref: '#/components/schemas/ValidationScope'
        path:
          type: string
          example: params.replicas
        code:
          type: string
          example: GTE_VIOLATED
        constraint:
          type: string
        message:
          type: string
        severity:
          type: string
          enum:
          - ERROR
          - WARNING
        rule_id:
          type: string
        expected: {}
        actual: {}
    ValidationScope:
      type: string
      enum:
      - input
      - run_spec
      description: Path refers to the submitted form (input, also the default if absent) or the compiled
        RunSpec (run_spec).
    SchemaValue:
      type: object
      description: 'A schemapb value (plain JSON object). The concrete schema is named by

        the enclosing property''s `x-schema`; validate via

        `/catalog/schemas/{id}:validate`.

        Integers outside the JavaScript safe range are returned as exact decimal

        strings. Send these strings back unchanged; never convert them to Number.

        '
      additionalProperties: true
    BakedValue:
      type: object
      description: schemapb `Baked` (schema embedded + canonical values), protoJSON.
      required:
      - schema
      - values
      properties:
        schema:
          type: object
          additionalProperties: true
        values:
          type: object
          additionalProperties: true
    SchemaRef:
      type: object
      required:
      - id
      - version
      properties:
        id:
          type: string
          example: db.postgres.params
        version:
          type: string
          example: 1.0.0
    PageMeta:
      type: object
      properties:
        next_cursor:
          type:
          - string
          - 'null'
          maxLength: 1024
        has_more:
          type: boolean
    Facet:
      type: object
      required:
      - field
      - values
      properties:
        field:
          type: string
        values:
          type: array
          items:
            type: object
            required:
            - value
            - count
            properties:
              value:
                type: string
              label:
                type: string
              count:
                type: integer
    Entity:
      type: object
      description: Common header of tenant records.
      required:
      - id
      - name
      - created_at
      - updated_at
      - author
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 4096
        tags:
          type: object
          additionalProperties:
            type: string
          maxProperties: 64
        author:
          $ref: '#/components/schemas/UserRef'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type:
          - string
          - 'null'
          format: date-time
        is_favorite:
          type: boolean
    EntityPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 4096
        tags:
          type: object
          additionalProperties:
            type: string
    UserRef:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          description: IAM `sub`.
        display_name:
          type: string
        avatar:
          type: string
    Usage:
      type: object
      required:
      - kind
      - id
      - name
      properties:
        kind:
          type: string
          enum:
          - database
          - workload
          - test
          - suite
          - schedule
          - run
        id:
          type: string
          format: uuid
        name:
          type: string
    Requirements:
      type: object
      description: Minimal hardware per role, computed by the server.
      additionalProperties:
        $ref: '#/components/schemas/RoleRequirement'
    RoleRequirement:
      type: object
      properties:
        cpu:
          type: integer
        memory_gb:
          type: number
        disk_gb:
          type: number
        reason:
          type: string
          description: What drove the number (e.g. shared_buffers).
    Size:
      type: string
      enum:
      - XS
      - S
      - M
      - L
      - XL
    RoleSizes:
      type: object
      description: Size per role (`db`, `proxy`, `runner`, ...).
      additionalProperties:
        type: object
        required:
        - size
        properties:
          size:
            $ref: '#/components/schemas/Size'
          machine:
            allOf:
            - $ref: '#/components/schemas/SchemaValue'
            x-schema: test.machine@1
            description: Explicit VM settings over the selected preset.
          disk:
            type: object
            properties:
              type:
                type: string
                description: Provider disk type id from the catalog.
              gb:
                type: integer
                minimum: 10
    Fit:
      type: object
      required:
      - fits
      properties:
        fits:
          type: boolean
        issues:
          type: array
          items:
            type: object
            required:
            - path
            - code
            - severity
            properties:
              scope:
                $ref: '#/components/schemas/ValidationScope'
              path:
                type: string
              code:
                type: string
              severity:
                type: string
                enum:
                - ERROR
                - WARNING
              message:
                type: string
              suggested:
                description: Suggested value (e.g. a size).
        stale:
          type: object
          description: Referenced library records changed since last validation.
          properties:
            database:
              type: boolean
            workload:
              type: boolean
    Ref:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          readOnly: true
    ExportDocument:
      type: object
      description: Portable YAML/JSON document (`kind`, `api_version`, `spec`).
      required:
      - api_version
      - kind
      - spec
      properties:
        api_version:
          type: string
          example: stroppy.io/v1
        kind:
          type: string
          enum:
          - Database
          - Workload
          - Test
          - Suite
        metadata:
          type: object
          properties:
            name:
              type: string
            description:
              type: string
            tags:
              type: object
              additionalProperties:
                type: string
        spec:
          type: object
          additionalProperties: true
    Diff:
      type: object
      required:
      - changes
      properties:
        changes:
          type: array
          items:
            type: object
            required:
            - path
            - op
            properties:
              path:
                type: string
              op:
                type: string
                enum:
                - add
                - remove
                - replace
              a: {}
              b: {}
    PublicConfig:
      type: object
      required:
      - iam
      - tenant_creation
      - public_rating_enabled
      - version
      properties:
        iam:
          type: object
          required:
          - base_url
          - client_id
          - environment
          properties:
            base_url:
              type: string
              description: Same-origin proxy base ('' in prod).
            client_id:
              type: string
            environment:
              type: string
        tenant_creation:
          type: string
          enum:
          - anyone
          - admin_only
        public_rating_enabled:
          type: boolean
        examples_enabled:
          type: boolean
        version:
          type: string
        commit:
          type: string
    PublicCatalog:
      type: object
      required:
      - databases
      - providers
      properties:
        databases:
          type: array
          items:
            type: object
            required:
            - kind
            - versions
            - topologies
            properties:
              kind:
                $ref: '#/components/schemas/DatabaseKind'
              title:
                type: string
              versions:
                type: array
                items:
                  type: string
              topologies:
                type: array
