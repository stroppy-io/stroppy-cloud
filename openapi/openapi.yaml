            pending:
              type: integer
            running:
              type: integer
            completed:
              type: integer
            failed:
              type: integer
            cancelled:
              type: integer
            kept_stands:
              type: integer
        success_rate:
          type: number
        recent_runs:
          type: array
          items:
            $ref: '#/components/schemas/Run'
        recent_suite_runs:
          type: array
          items:
            $ref: '#/components/schemas/SuiteRun'
        upcoming:
          type: array
          items:
            $ref: '#/components/schemas/Schedule'
        top_results:
          type: array
          items:
            $ref: '#/components/schemas/RatingEntry'
        providers:
          type: array
          items:
            $ref: '#/components/schemas/ProviderProfile'
        limits:
          $ref: '#/components/schemas/TenantLimits'
    AdminStatus:
      type: object
      required:
      - version
      - commit
      - components
      - pipelines
      - runs
      properties:
        version:
          type: string
        commit:
          type: string
        started_at:
          type: string
          format: date-time
        components:
          type: object
          additionalProperties:
            type: object
            required:
            - status
            properties:
              status:
                type: string
                enum:
                - ok
                - degraded
                - down
