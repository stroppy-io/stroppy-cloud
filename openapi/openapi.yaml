            type: object
            additionalProperties:
              type: string
        metrics:
          $ref: '#/components/schemas/RunMetrics'
        workload_segments:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              started_at:
                type: string
                format: date-time
              finished_at:
                type: string
                format: date-time
    TenantDashboard:
