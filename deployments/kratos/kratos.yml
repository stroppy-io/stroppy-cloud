# Ory Kratos, self-hosted, as the only identity provider of Stroppy Cloud.
#
# This file is the DEV COMPOSE shape (make dev): Mailpit courier, dev JWT key
# set committed next to it, plaintext Postgres over the compose network.
# Production overrides (see README.md): DSN and secrets via environment,
# per-installation signing keys, real SMTP in courier, public base_url on
# https://iam.stroppy.io.
#
# The contract with the server is one template: `stroppy`. The SPA exchanges
# a Kratos session for the template's JWT (whoami?tokenize_as=stroppy) and
# calls the API with it as a Bearer; the server verifies locally (JWKS),
# no per-request calls to Kratos.
version: v26.2.0

dsn: postgres://postgres@postgres:5432/kratos?sslmode=disable&max_conns=20

serve:
  public:
    port: 4433
    # Same-origin through the server's /v1 proxy: the SPA's browser flows
    # (login, registration) keep their cookies and CSRF without any
    # cross-site setup. Flow links and ui.action URLs come out under /v1.
    base_url: http://localhost:18347/v1
    cors:
      enabled: true
      allowed_origins:
        - http://localhost:18347
        - http://localhost:5173
      allowed_methods: [POST, GET, PUT, PATCH, DELETE]
      allowed_headers: [Authorization, Content-Type, Accept, X-Session-Token]
      exposed_headers: [Content-Type, Set-Cookie]
      allow_credentials: true
  admin:
    port: 4434
    base_url: http://localhost:4434

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

selfservice:
  default_browser_return_url: http://localhost:18347/
  allowed_return_urls:
    - http://localhost:18347
    - http://localhost:5173
  methods:
    password:
      enabled: true
    # One-time codes for verification and recovery mails.
    code:
      enabled: true
    # Sign-in with GitHub (github.jsonnet maps the claims). Off on a stand
    # without its own OAuth App: compose turns it on and fills the provider
    # (client id and secret) from STROPPY_DEV_GITHUB_* in .env.compose. With a
    # provider on, the SPA signs people up through it only.
    oidc:
      enabled: false
      config:
        providers: []
  flows:
    # Every flow has its screen in the SPA: links in mails and Kratos
    # redirects land there with ?flow=<id>, the page continues the flow.
    error:
      ui_url: http://localhost:18347/auth/error
    login:
      ui_url: http://localhost:18347/login
    registration:
      # The kill switch of public sign-up: `false` closes the platform —
      # nobody (invited people included) can self-register until it is back
      # on; the admin API can still create identities. Prod overlay sets it.
      enabled: true
      ui_url: http://localhost:18347/register
      after:
        password:
          hooks:
            # Signed in right away; the address is confirmed afterwards
            # (the SPA continues to /verify via continue_with).
            - hook: session
            - hook: show_verification_ui
        # GitHub confirmed the address already: signed in, nothing to verify.
        oidc:
          hooks:
            - hook: session
    verification:
      enabled: true
      use: code
      ui_url: http://localhost:18347/verify
      after:
        default_browser_return_url: http://localhost:18347/
    recovery:
      enabled: true
      use: code
      ui_url: http://localhost:18347/recovery
    # A successful recovery code opens a privileged settings flow: the
    # new password is set there.
    settings:
      ui_url: http://localhost:18347/me/security
      privileged_session_max_age: 15m

session:
  lifespan: 720h
  whoami:
    required_aal: aal1
    tokenizer:
      templates:
        stroppy:
          jwks_url: file:///etc/config/kratos/jwks/kratos-jwks.json
          claims_mapper_url: file:///etc/config/kratos/claims.jsonnet
          ttl: 10m

courier:
  # Our own mails, served by the server's internal listener from the
  # templates in its binary (internal/infrastructure/kratos/courier): the code
  # to confirm the address, the code to reset the password, and the "no such
  # account" variants of both. The version segment only busts the Kratos
  # template cache; production puts the image tag there.
  templates:
    verification_code:
      valid:
        email:
          subject: http://server:18348/internal/kratos/mail/dev/verification_code/valid/email.subject.gotmpl
          body:
            html: http://server:18348/internal/kratos/mail/dev/verification_code/valid/email.body.gotmpl
            plaintext: http://server:18348/internal/kratos/mail/dev/verification_code/valid/email.body.plaintext.gotmpl
      invalid:
        email:
          subject: http://server:18348/internal/kratos/mail/dev/verification_code/invalid/email.subject.gotmpl
          body:
            html: http://server:18348/internal/kratos/mail/dev/verification_code/invalid/email.body.gotmpl
            plaintext: http://server:18348/internal/kratos/mail/dev/verification_code/invalid/email.body.plaintext.gotmpl
    recovery_code:
      valid:
        email:
          subject: http://server:18348/internal/kratos/mail/dev/recovery_code/valid/email.subject.gotmpl
          body:
            html: http://server:18348/internal/kratos/mail/dev/recovery_code/valid/email.body.gotmpl
            plaintext: http://server:18348/internal/kratos/mail/dev/recovery_code/valid/email.body.plaintext.gotmpl
      invalid:
        email:
          subject: http://server:18348/internal/kratos/mail/dev/recovery_code/invalid/email.subject.gotmpl
          body:
            html: http://server:18348/internal/kratos/mail/dev/recovery_code/invalid/email.body.gotmpl
            plaintext: http://server:18348/internal/kratos/mail/dev/recovery_code/invalid/email.body.plaintext.gotmpl
  smtp:
    connection_uri: smtp://mailpit:1025/?disable_starttls=true
    from_address: no-reply@stroppy.io
    from_name: Stroppy Cloud

secrets:
  default:
    - dev-only-insecure-kratos-session-secret

log:
  level: info
  format: text
