name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Build-only rehearsal version (no publication)'
        required: true
        default: '0.1.0'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Check tag-only release helper
        run: python3 -B -m unittest discover -s scripts -p test_release.py
      - name: Validate version and build identity
        id: identity
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          version="${RELEASE_VERSION#v}"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "created=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build server, embedded UI and pipeline binaries
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployments/Dockerfile
          # The shipped pipeline executables run locally for manifest export
          # and target the existing linux/amd64 Graphene execution profile.
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          outputs: ${{ github.event_name == 'workflow_dispatch' && 'type=oci,dest=/tmp/stroppy-cloud.oci.tar' || '' }}
          tags: |
            ${{ steps.identity.outputs.image }}:${{ steps.identity.outputs.version }}
            ${{ steps.identity.outputs.image }}:latest
          build-args: |
            VERSION=${{ steps.identity.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.identity.outputs.created }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.identity.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.identity.outputs.created }}
            org.opencontainers.image.title=Stroppy Cloud
          cache-from: type=gha,scope=stroppy-cloud-release
          cache-to: type=gha,mode=max,scope=stroppy-cloud-release
      - uses: actions/upload-artifact@v6
        if: github.event_name == 'workflow_dispatch'
        with:
          name: container-rehearsal
          path: /tmp/stroppy-cloud.oci.tar
          compression-level: 0
          retention-days: 3
      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          RELEASE_IMAGE: ${{ steps.identity.outputs.image }}
          RELEASE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 scripts/release-notes.py
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file /tmp/release-notes.md
          else
            gh release create "$tag" --verify-tag --title "$tag" --notes-file /tmp/release-notes.md
          fi
          gh release upload "$tag" --clobber /tmp/image-digest.txt
